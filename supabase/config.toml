# Supabase CLI configuration for local development (`supabase start`).
# The hosted project is configured from the dashboard; this file only affects
# the local Docker stack.

project_id = "mira"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Local inbox for confirmation and invite emails.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off locally so signing up does not need the mail catcher; turn it on in the
# hosted project.
enable_confirmations = false

# Set MIRA_GOOGLE_CLIENT_ID / MIRA_GOOGLE_SECRET in supabase/.env to try OAuth
# against the local stack.
[auth.external.google]
enabled = false
client_id = "env(MIRA_GOOGLE_CLIENT_ID)"
secret = "env(MIRA_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[auth.external.github]
enabled = false
client_id = "env(MIRA_GITHUB_CLIENT_ID)"
secret = "env(MIRA_GITHUB_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[analytics]
enabled = false
